
<!DOCTYPE html>
<html>
<head>
    <title>ReShare - Donor</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="index.html">ReShare</a>
            <a href="login.html" class="btn btn-light">Logout</a>
        </div>
    </nav>

    <div class="container mt-4">

        <h2>Welcome, Donor!</h2>
        <p>Share your unused items with people who need them.</p>

        <h4 class="mt-4">Add Donation</h4>

        <div class="card p-4">

            <form>

                <div class="mb-3">
                    <label class="form-label">Item Name</label>
                    <input type="text" class="form-control" placeholder="Enter item name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select class="form-select">
                        <option>Clothes</option>
                        <option>Books</option>
                        <option>Furniture</option>
                        <option>Electronics</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" rows="3" placeholder="Describe your item"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Item Condition</label>
                    <select class="form-select">
                        <option>New</option>
                        <option>Good</option>
                        <option>Used</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Pickup Location</label>
                    <input type="text" class="form-control" placeholder="Enter location">
                </div>

                <button type="submit" class="btn btn-success">
                    Submit Donation
                </button>

            </form>

        </div>

        <h4 class="mt-4">My Donations</h4>

        <table class="table table-bordered mt-3">

            <tr class="table-success">
                <th>Item</th>
                <th>Category</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>Books</td>
                <td>Education</td>
                <td>Pending</td>
            </tr>

            <tr>
                <td>Clothes</td>
                <td>Clothing</td>
                <td>Approved</td>
            </tr>

        </table>

    </div>

</body>
</html>
